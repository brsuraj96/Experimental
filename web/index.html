<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzle World</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1E1E2F;
      color: white;
    }
    #root {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .loader h1 {
      color: #FF6F61;
    }
    .loader p {
      color: #4DD0E1;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loader">
      <h1>Puzzle World</h1>
      <p>Loading the game platform...</p>
    </div>
  </div>
  <script type="module">
    // Import the needed modules directly
    import React from 'https://cdn.jsdelivr.net/npm/react@18.2.0/+esm';
    import ReactDOM from 'https://cdn.jsdelivr.net/npm/react-dom@18.2.0/+esm';
    
    // Simple React component to show something works
    const App = () => {
      return React.createElement('div', { style: { 
          color: 'white', 
          padding: '2rem', 
          textAlign: 'center' 
        }},
        React.createElement('h1', { style: { color: '#FF6F61' }}, 'Puzzle World'),
        React.createElement('p', null, 'React is now working in the browser!'),
        React.createElement('p', null, 'Mobile app functionality can be accessed through React Native.')
      );
    };
    
    // Render to the root div
    ReactDOM.render(
      React.createElement(App),
      document.getElementById('root')
    );
  </script>
</body>
</html>
