<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzle World</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1E1E2F;
      color: white;
    }
    #root {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .loader h1 {
      color: #FF6F61;
    }
    .loader p {
      color: #4DD0E1;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loader">
      <h1>Puzzle World</h1>
      <p>Loading the game platform...</p>
    </div>
  </div>
  <script src="/index.js" defer></script>
</body>
</html>
